# Local dev infra: Postgres (app + Keycloak databases) and Keycloak with the "sinapps" realm.
# Optional: `docker compose --profile observability up` for Grafana LGTM (OTLP :4317/:4318, UI :3300).
name: sinapps

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: sinapps
      POSTGRES_PASSWORD: sinapps
      POSTGRES_DB: sinapps
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinapps -d sinapps"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: sinapps
      KC_DB_PASSWORD: sinapps
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8180"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image ships without curl: raw HTTP request on the management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: ["observability"]
    ports:
      - "3300:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres-data:
